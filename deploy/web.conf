# nginx ของหน้าเว็บ TFP: ไฟล์ static ของ React และส่ง /api/ ไป API (ภายในเครือข่าย compose)
# HTTPS/HSTS/โดเมนจริงให้ reverse proxy ของหน่วยงาน (IT) จัดการ — ไฟล์นี้ใช้ภายในเครื่อง/เครือข่ายภายใน
server_tokens off;
upstream tfp_api {
    zone tfp_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off; # Docker DNS: refresh API address after container restart/replacement.
    server api:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # ฟอนต์ Prompt/Material Symbols จาก Google Fonts เหมือนแอปเดิม; style ฝังในหน้าเดิมจึงต้องใช้ 'unsafe-inline' สำหรับ style เท่านั้น
    # frame-ancestors: ให้ IT กำหนดโดเมนที่ฝังหน้านี้ได้ (ค่าเริ่มต้นเฉพาะตัวเอง)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://tfp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # asset ของหน้า (รูป/ฟอนต์) cache ได้นาน — header มาจาก API
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # add_header in this location disables inheritance from the server block.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri /index.html;
    }
}
